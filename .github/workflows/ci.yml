name: CI

# Builds and tests on Windows, Linux and macOS, on x64 and Arm64: the decoders have SIMD code for
# each CPU, and every machine must give the same pixels.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - run: dotnet build -c Release
      - run: dotnet test -c Release --no-build

  # The API reference is up to date with the doc comments, the docs' links resolve, and the samples in
  # the README and the guide compile
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'
      - name: Check the API reference
        run: dotnet run tools/api-docs/generate.cs -- --check
      - name: Check the links and samples
        run: python tools/api-docs/check-docs.py
