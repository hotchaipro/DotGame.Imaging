name: Publish

# Tests and packs DotGame.Imaging, and pushes the package to the hotchaipro GitHub Packages feed
# (https://nuget.pkg.github.com/hotchaipro/index.json). Run by hand, with the package's version.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The package's version, such as 0.1.0-alpha.1
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Not a version: $VERSION"; exit 1; }
      - run: dotnet build -c Release "-p:Version=$VERSION"
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src -c Release --no-build -o out "-p:Version=$VERSION"
      - run: dotnet nuget push "out/*.nupkg" --source https://nuget.pkg.github.com/hotchaipro/index.json --api-key "${{ secrets.GITHUB_TOKEN }}"
