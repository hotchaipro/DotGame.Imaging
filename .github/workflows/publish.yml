name: Publish

# Tests and packs DotGame.Imaging, and publishes it to nuget.org with trusted publishing: no API key is
# stored anywhere. nuget.org's trusted publishing policy names this repository and this workflow, and the
# login step trades this run's GitHub identity for a key that lasts an hour. Run by hand, with the
# package's version. A version on nuget.org can't be replaced or deleted, only unlisted.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The package's version, such as 0.1.0-preview.1
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Not a version: $VERSION"; exit 1; }
      - run: dotnet build -c Release "-p:Version=$VERSION" -p:ContinuousIntegrationBuild=true
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src -c Release --no-build -o out "-p:Version=$VERSION"
      - uses: NuGet/login@v1
        id: login
        with:
          user: hotchai
      # Pushes the symbols package (.snupkg) beside it too
      - run: dotnet nuget push "out/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
